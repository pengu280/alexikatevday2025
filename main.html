<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine?</title>
    <style>
        body {
            background-color: lightpink;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Prevent scrolling when the button moves */
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #ff1493;
        }
        .buttons {
            margin-top: 20px;
            position: relative; /* Ensure the buttons are positioned relative to the container */
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.5s ease; /* Smooth transition for movement */
        }
        #yesButton {
            background-color: #ff69b4;
            color: white;
        }
        #noButton {
            background-color: #ff1493;
            color: white;
            position: static; /* Reset position */
        }
        .small-text {
            font-size: 12px;
            color: #888;
            margin-top: 5px;
        }
        /* Add this class to style the image */
        .valentine-image {
            max-width: 100%;
            height: auto;
            margin-top: 20px;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Will You Be My Valentine?</h1>

        <!-- Add your photo here -->
        <!--
        <img src="your-image-url.jpg" alt="Valentine Photo" class="valentine-image">
        -->

        <div class="buttons">
            <button id="yesButton" onclick="alert('Yay! You made me the happiest person! ❤️')">Yes</button>
            <button id="noButton">No</button>
            <div class="small-text">Pressing no allows me the right to repossess your iPad</div>
        </div>
    </div>

    <script>
        const noButton = document.getElementById('noButton');

        noButton.addEventListener('mouseover', () => {
            // Calculate random position within the screen
            const x = Math.random() * (window.innerWidth - noButton.offsetWidth);
            const y = Math.random() * (window.innerHeight - noButton.offsetHeight);

            // Move the button smoothly
            noButton.style.position = 'absolute';
            noButton.style.left = `${x}px`;
            noButton.style.top = `${y}px`;
        });

        // Reset the button position when the mouse leaves the window
        document.addEventListener('mouseleave', () => {
            noButton.style.position = 'static';
        });
    </script>
</body>
</html>
