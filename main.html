<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will You Be My Valentine Alexi?</title>
    <style>
        body {
            background-color: lightpink;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; /* Prevent scrolling when the button moves */
        }
        .container {
            text-align: center;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #ff1493;
        }
        .buttons {
            margin-top: 20px;
            position: relative; /* Ensure the buttons are positioned relative to the container */
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        #yesButton {
            background-color: #ff69b4;
            color: white;
        }
        #noButton {
            background-color: #ff1493;
            color: white;
            position: static; /* Reset position */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Will You Be My Valentine?</h1>
        <div class="buttons">
            <button id="yesButton" onclick="alert('Yay! You made me the happiest person! ❤️')">Yes</button>
            <button id="noButton">No</button>
        </div>
    </div>

    <script>
        const noButton = document.getElementById('noButton');

        noButton.addEventListener('mouseover', () => {
            // Calculate random position within the screen
            const x = Math.random() * (window.innerWidth - noButton.offsetWidth);
            const y = Math.random() * (window.innerHeight - noButton.offsetHeight);

            // Move the button smoothly
            noButton.style.transition = 'left 0.5s ease, top 0.5s ease';
            noButton.style.position = 'absolute';
            noButton.style.left = `${x}px`;
            noButton.style.top = `${y}px`;
        });

        // Reset the button position when the mouse leaves
        noButton.addEventListener('mouseout', () => {
            noButton.style.transition = 'none'; // Disable transition for instant reset
            noButton.style.position = 'static';
        });
    </script>
</body>
</html>
